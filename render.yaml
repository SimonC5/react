# Despliegue en Render (https://render.com). Al conectar el repositorio, Render
# lee este archivo y crea los dos servicios ya enlazados entre sí: no hay que
# copiar URLs de un servicio al otro a mano. Las claves reales (IA_API_KEY) se
# escriben en el panel de Render, nunca en el repositorio.
services:
  # API FastAPI. Sin DB_ENGINE usa SQLite, que se crea y se siembra al arrancar.
  - type: web
    name: simonc-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: JWT_SECRET
        generateValue: true
      # El dominio del Frontend lo pone Render solo, para que CORS cuadre.
      - key: FRONTEND_URL
        fromService:
          name: simonc-web
          type: web
          property: host
      # Chatbot: la clave se escribe en el panel (sync: false la deja vacía).
      - key: IA_API_KEY
        sync: false
      - key: IA_API_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
      - key: IA_MODEL
        value: gemini-flash-latest

  # Frontend Vite. Cualquier ruta se reenvía a index.html porque es una SPA.
  - type: web
    name: simonc-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # La dirección de la API la pone Render sola, con el dominio del servicio.
      - key: VITE_API_URL
        fromService:
          name: simonc-api
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
