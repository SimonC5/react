# Despliegue en Render (https://render.com). Al conectar el repositorio, Render
# lee este archivo y crea los dos servicios. Las direcciones públicas van
# escritas completas: al enlazar un servicio con otro, Render entrega el nombre
# interno ("simonc-api"), que el navegador no puede resolver. Las claves reales
# (IA_API_KEY) se escriben en el panel de Render, nunca en el repositorio.
services:
  # API FastAPI. Sin DB_ENGINE usa SQLite, que se crea y se siembra al arrancar.
  - type: web
    name: simonc-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: JWT_SECRET
        generateValue: true
      # Dominio público del Frontend, para que CORS cuadre y para los enlaces
      # de recuperación de contraseña. Va escrito completo a propósito: al
      # enlazar servicios, Render entrega el nombre interno ("simonc-web"), que
      # el navegador no puede resolver.
      - key: FRONTEND_URL
        value: https://simonc-web.onrender.com
      # Red de seguridad por si Render le agrega un sufijo al nombre.
      - key: CORS_ORIGIN_REGEX
        value: ^https://simonc-web(-[a-z0-9]+)?\.onrender\.com$
      # Chatbot: la clave se escribe en el panel (sync: false la deja vacía).
      - key: IA_API_KEY
        sync: false
      - key: IA_API_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
      # Varios modelos separados por coma: si el primero está saturado (el plan
      # gratuito devuelve 503), se intenta con el siguiente. Van primero los
      # más livianos, que contestan rápido; los que razonan antes de escribir
      # quedan de reserva porque a veces se pasan del tiempo de espera.
      - key: IA_MODEL
        value: gemini-2.0-flash,gemini-flash-lite-latest,gemini-flash-latest,gemini-2.5-flash

  # Frontend Vite. Cualquier ruta se reenvía a index.html porque es una SPA.
  - type: web
    name: simonc-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Dirección pública de la API, escrita completa por la misma razón que
      # FRONTEND_URL. Vite la incrusta al compilar, así que si esta línea
      # cambia hay que volver a publicar el Frontend.
      - key: VITE_API_URL
        value: https://simonc-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
